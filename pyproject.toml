[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-multi-agent-intelligence-engine"
version = "0.1.0"
description = "RAG multi-agent intelligence engine with LangChain, LangGraph, Qdrant, and local LLM providers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "langchain>=0.2.14",
  "langchain-community>=0.2.12",
  "langchain-core>=0.2.35",
  "langchain-text-splitters>=0.2.2",
  "langchain-huggingface>=0.0.3",
  "langchain-ollama>=0.1.1",
  "langchain-qdrant>=0.1.3",
  "langgraph>=0.2.14",
  "qdrant-client>=1.11.0",
  "sentence-transformers>=3.0.1",
  "tiktoken>=0.7.0",
  "rank-bm25>=0.2.2",
  "jq>=1.8.0",
  "pypdf>=4.3.0",
  "python-multipart>=0.0.9",
  "orjson>=3.10.7",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.0",
  "mypy>=1.11.0"
]

[project.scripts]
rag-api = "rag_engine.api.main:run"
rag-ingest = "rag_engine.cli:ingest_command"
rag-eval = "rag_engine.cli:eval_command"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
